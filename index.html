<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OR Influence and Collaboration Assessment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1f30; --surface: #16283a; --elevated: #1c3146;
      --fg: #f3efe6; --muted: #9aa8b6; --subtle: #6e7c8a;
      --border: rgba(243,239,230,.14); --border-strong: rgba(243,239,230,.28);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Source Sans 3", system-ui, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; }
    button:not(:disabled), [role=button] { cursor: pointer; }
    header { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .mark { letter-spacing: .2em; font-size: 14px; font-weight: 500; color: var(--muted); }
    .track { flex: 1; height: 4px; background: var(--elevated); border-radius: 999px; overflow: hidden; }
    .fill { height: 100%; background: var(--fg); border-radius: 999px; width: 0; transition: width .3s ease; }
    .pct { width: 36px; text-align: right; font-size: 12px; color: var(--subtle); font-variant-numeric: tabular-nums; }
    main { max-width: 720px; margin: 0 auto; padding: 40px 24px 80px; }
    .chip { display: inline-flex; background: var(--elevated); color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; padding: 4px 12px; border-radius: 999px; }
    h1, h2, .display { font-family: Fraunces, Georgia, serif; font-weight: 500; letter-spacing: -0.02em; }
    h1 { font-size: clamp(2rem, 4vw, 3rem); line-height: 1.15; }
    .lede { margin-top: 24px; font-size: 18px; line-height: 1.55; color: var(--muted); max-width: 36em; }
    .stats { margin-top: 32px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 20px; text-align: center; }
    .stats strong { display: block; font-family: Fraunces, Georgia, serif; font-size: 24px; font-weight: 500; }
    .stats span { display: block; margin-top: 4px; font-size: 14px; color: var(--subtle); }
    .note { margin-top: 32px; font-size: 14px; line-height: 1.55; color: var(--muted); }
    .fine { margin-top: 12px; font-size: 14px; line-height: 1.55; color: var(--subtle); font-style: italic; }
    .btn { min-height: 48px; width: 100%; border: 0; border-radius: 8px; padding: 16px 32px; font-size: 16px; font-weight: 600; font-family: inherit; }
    .btn-primary { margin-top: 40px; background: var(--fg); color: var(--bg); }
    .btn-ghost { margin-top: 12px; background: transparent; color: var(--fg); border: 1px solid var(--border); font-weight: 500; }
    .btn:disabled { background: var(--elevated); color: var(--subtle); cursor: not-allowed; }
    @media (min-width: 640px) { .btn { width: auto; } }
    label { display: block; margin-bottom: 20px; }
    label span { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: var(--muted); }
    input, select, textarea { width: 100%; min-height: 48px; border: 1px solid var(--border); background: var(--elevated); color: var(--fg); border-radius: 8px; padding: 12px 16px; font: inherit; font-size: 16px; outline: none; }
    textarea { min-height: 160px; resize: vertical; line-height: 1.5; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .row span { font-size: 14px; color: var(--subtle); }
    .back { background: none; border: 0; color: var(--subtle); font: inherit; min-height: 44px; }
    .cat { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--subtle); margin-bottom: 12px; }
    .opt { display: flex; align-items: flex-start; gap: 12px; width: 100%; min-height: 48px; text-align: left; border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; font: inherit; }
    .opt.on { border-color: var(--fg); background: var(--fg); color: var(--bg); }
    .dot { width: 24px; height: 24px; border-radius: 999px; border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; margin-top: 2px; }
    .opt.on .dot { border-color: var(--bg); background: var(--bg); color: var(--fg); }
    .card { border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 20px; margin-top: 16px; }
    .bar { height: 8px; background: var(--elevated); border-radius: 999px; margin-top: 8px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--fg); }
    .items { margin-top: 12px; }
    .items li { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--border); padding: 10px 0; font-size: 14px; color: var(--muted); }
    .items b { color: var(--fg); font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .comment { margin-top: 16px; background: var(--elevated); border-radius: 8px; padding: 16px; }
    .comment p { margin-top: 8px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
    .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
    .scores div { background: var(--elevated); border-radius: 8px; padding: 12px; }
    .scores dt { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--subtle); }
    .scores dd { margin-top: 4px; font-family: Fraunces, Georgia, serif; font-size: 20px; }
    #radar { width: 100%; height: 360px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <span class="mark">OR</span>
    <div class="track"><div class="fill" id="fill"></div></div>
    <span class="pct" id="pct">0%</span>
  </header>
  <main id="app"></main>
  <script>
    const CATS = [
      { id: "slt-feedback", name: "Effectiveness of Feedback to SLT", short: "SLT Feedback", radar: ["SLT","Feedback"], theme: "Value-added, timely, consistent, clear, actionable, simple." },
      { id: "svp-plant", name: "Quality of relationships with SVP / Plant Manager", short: "SVP / Plant Manager", radar: ["SVP /","Plant Mgr"], theme: "Healthy pushback, structured time, verbal and written line up." },
      { id: "directors-mlm", name: "Quality of relationships with Directors and MLMs", short: "Directors & MLMs", radar: ["Directors","& MLMs"], theme: "Feedback valued and acted on; enough time; not only when convenient." },
      { id: "fleet", name: "Fleet Collaboration", short: "Fleet", radar: ["Fleet"], theme: "Best practices across the fleet; strong ties to HR, Comms, Employee Concerns." }
    ];
    const Q = [
      ["s1","slt-feedback","Raises issues and observations the SLT would not have seen on its own."],
      ["s2","slt-feedback","Raises the issue while leadership can still change course."],
      ["s3","slt-feedback","Gives SLT feedback as a regular practice, not only when there is an emergent issue."],
      ["s4","slt-feedback","Describes issues clearly with actionable next steps."],
      ["p1","svp-plant","Discussions have healthy conflict from both sides to broaden perspectives and increase understanding."],
      ["p2","svp-plant","Puts time on the calendar for feedback."],
      ["p3","svp-plant","Challenges leaders to match what they say vs. what they put in writing."],
      ["p4","svp-plant","Keeps challenge about the work, not about status, saving face, or who “won.”"],
      ["d1","directors-mlm","Spends enough time with Directors and mid-level managers to build working relationships."],
      ["d2","directors-mlm","Provides feedback when it is uncomfortable, not only when it is easy."],
      ["d3","directors-mlm","Directors and mid-level managers find the feedback useful rather than something to endure."],
      ["d4","directors-mlm","Leaders take action from the feedback."],
      ["f1","fleet","Brings practices and lessons from across the fleet."],
      ["f2","fleet","Makes what they learn usable for other sites."],
      ["f3","fleet","Relationships with HR, Communications, and Employee Concerns are developed and effective."]
    ].map(([id, categoryId, text]) => ({ id, categoryId, text }));
    const SCALE = [
      [1,"Rarely true"],[2,"Occasionally true"],[3,"Sometimes true"],
      [4,"Often true"],[5,"Consistently true"],[0,"Unable to observe"]
    ];
    const ROLES = ["SLT member","SVP / Plant Manager","Director","Mid-level manager","HR / Communications / Employee Concerns","Peer at another site","Other"];
    const SAMPLE_A = { s1:5,s2:4,s3:5,s4:4,p1:3,p2:4,p3:3,p4:3,d1:2,d2:3,d3:2,d4:3,f1:4,f2:4,f3:5 };
    const SAMPLE_C = {
      "slt-feedback": "Raises issues SLT would not have seen, and does it while there is still time to change course. Next steps are usually clear.",
      "svp-plant": "Healthy conflict is present in the room. Calendar time for feedback is inconsistent, and verbal and written do not always line up.",
      "directors-mlm": "Not enough time with Directors and MLMs. Feedback can land as something to endure. Follow-through after the conversation is the gap.",
      fleet: "Brings practices from other sites and makes them usable here. Ties to HR, Communications, and Employee Concerns are developed and effective."
    };
    const STEPS = CATS.flatMap(c => [
      ...Q.filter(q => q.categoryId === c.id).map(q => ({ kind: "q", id: q.id })),
      { kind: "c", id: c.id }
    ]);
    const cat = id => CATS.find(c => c.id === id);
    const mean = (id, a) => {
      const v = Q.filter(q => q.categoryId === id).map(q => a[q.id]).filter(x => x > 0);
      return v.length ? v.reduce((s,n)=>s+n,0)/v.length : null;
    };
    const S = {
      phase: "landing", i: 0,
      profile: { name:"", role:"", subject:"", site:"" },
      answers: Object.fromEntries(Q.map(q => [q.id, null])),
      comments: Object.fromEntries(CATS.map(c => [c.id, ""]))
    };
    function setProgress(n) {
      document.getElementById("fill").style.width = n + "%";
      document.getElementById("pct").textContent = n + "%";
    }
    function h(html) { document.getElementById("app").innerHTML = html; }
    function on(sel, fn) { document.querySelector(sel)?.addEventListener("click", fn); }
    function render() {
      if (S.phase === "landing") {
        setProgress(0);
        h(`<p class="chip">Client preview</p>
          <p class="display" style="margin-top:24px;font-size:18px;color:var(--muted)">OR</p>
          <h1>Influence and Collaboration Assessment</h1>
          <p class="lede">A 15-item instrument for how this role shows up with SLT, the Plant Manager, Directors and mid-level managers, and the wider fleet.</p>
          <div class="stats"><div><strong>15</strong><span>items</span></div><div><strong>4</strong><span>categories</span></div><div><strong>6–8</strong><span>minutes</span></div></div>
          <p class="note">Rate what you have actually observed. There are no right answers. Use “Unable to observe” when you do not have a basis to judge.</p>
          <p class="fine">Responses in this preview are not saved. Walk the experience before fielding.</p>
          <button class="btn btn-primary" id="begin">Begin the assessment</button>
          <button class="btn btn-ghost" id="sample">View a sample report</button>`);
        on("#begin", () => { S.phase = "profile"; render(); });
        on("#sample", () => {
          S.profile = { name:"Sample rater", role:"SLT member", subject:"Site OR", site:"Preview plant" };
          S.answers = { ...SAMPLE_A }; S.comments = { ...SAMPLE_C }; S.phase = "results"; render();
        });
        return;
      }
      if (S.phase === "profile") {
        setProgress(4);
        h(`<h1>Before we begin</h1>
          <p class="note">This information contextualizes results. Individual comments stay attributed only as the team agrees when fielding.</p>
          <form id="pf" style="margin-top:32px">
            <label><span>Your name</span><input id="name" placeholder="First and last name" value="${esc(S.profile.name)}" /></label>
            <label><span>Your relationship to the person being rated</span>
              <select id="role"><option value="">Select your vantage point</option>${ROLES.map(r=>`<option${S.profile.role===r?" selected":""}>${r}</option>`).join("")}</select>
            </label>
            <label><span>Person or role being rated (optional in preview)</span><input id="subject" placeholder="Name or role" value="${esc(S.profile.subject)}" /></label>
            <label><span>Site / plant (optional)</span><input id="site" placeholder="Plant or site name" value="${esc(S.profile.site)}" /></label>
            <button class="btn btn-primary" type="submit">Start the assessment</button>
          </form>`);
        document.getElementById("pf").onsubmit = e => {
          e.preventDefault();
          S.profile = { name: name.value, role: role.value, subject: subject.value, site: site.value };
          S.i = 0; S.phase = "survey"; render();
        };
        return;
      }
      if (S.phase === "survey") {
        setProgress(Math.round(((S.i+1)/STEPS.length)*100));
        const step = STEPS[S.i];
        if (step.kind === "q") {
          const q = Q.find(x => x.id === step.id);
          const c = cat(q.categoryId);
          const qn = Q.findIndex(x => x.id === q.id) + 1;
          h(`<div class="row"><span>Question ${qn} of ${Q.length}</span><button class="back" id="back">Back</button></div>
            <p class="cat">${c.name}</p>
            <h2 style="font-size:1.6rem;line-height:1.25">${q.text}</h2>
            <p class="fine">${c.theme}</p>
            <div style="margin:32px 0">${SCALE.map(([v,l]) => `<button class="opt${S.answers[q.id]===v?" on":""}" data-v="${v}"><span class="dot">${v===0?"–":v}</span><span>${l}</span></button>`).join("")}</div>
            <button class="btn btn-primary" id="next" ${S.answers[q.id]==null?"disabled":""}>Next</button>`);
          document.querySelectorAll(".opt").forEach(b => b.onclick = () => { S.answers[q.id] = +b.dataset.v; render(); });
          on("#next", () => { if (S.answers[q.id]==null) return; S.i++; if (S.i>=STEPS.length) S.phase="results"; render(); });
          on("#back", back);
        } else {
          const c = cat(step.id);
          const last = S.i+1 >= STEPS.length;
          h(`<div class="row"><span>Optional comment</span><button class="back" id="back">Back</button></div>
            <p class="cat">${c.name}</p>
            <h2 style="font-size:1.6rem;line-height:1.25">Anything to add about ${c.short}?</h2>
            <p class="note">Specific examples help. Skip this if you have nothing to add.</p>
            <textarea id="cm" placeholder="Optional — what did you observe?">${esc(S.comments[c.id])}</textarea>
            <button class="btn btn-primary" id="next">${last?"See preview results":"Continue"}</button>`);
          on("#next", () => { S.comments[c.id] = document.getElementById("cm").value; S.i++; if (S.i>=STEPS.length) S.phase="results"; render(); });
          on("#back", () => { S.comments[c.id] = document.getElementById("cm").value; back(); });
        }
        return;
      }
      setProgress(100);
      const intro = [S.profile.name||"Preview rater", S.profile.role, S.profile.subject && "rating "+S.profile.subject, S.profile.site].filter(Boolean).join(" · ");
      const scores = CATS.map(c => ({ ...c, mean: mean(c.id, S.answers) }));
      const ranked = scores.filter(s => s.mean!=null).sort((a,b)=>b.mean-a.mean);
      const spread = ranked.length>=2 && ranked[0].mean !== ranked[ranked.length-1].mean;
      h(`<p class="chip">Preview results</p>
        <h1 style="margin-top:16px">Category snapshot</h1>
        <p class="lede">${esc(intro)}.</p>
        <section class="card">
          <h2>Strengths and gaps</h2>
          <p class="fine">Outer ring is 5 — consistently true. Inner is 1. Unable to observe is left off the mean and sits at the center.</p>
          <svg id="radar" viewBox="0 0 400 400" role="img" aria-label="Category radar"></svg>
          ${spread?`<p style="margin-top:8px;font-size:14px;line-height:1.5">Stronger on ${ranked[0].short} (${ranked[0].mean.toFixed(2)}). Weaker on ${ranked[ranked.length-1].short} (${ranked[ranked.length-1].mean.toFixed(2)}).</p>`:""}
          <dl class="scores">${scores.map(s=>`<div><dt>${s.short}</dt><dd>${s.mean==null?"n/a":s.mean.toFixed(2)}</dd></div>`).join("")}</dl>
        </section>
        ${CATS.map(c => {
          const m = mean(c.id, S.answers);
          const pct = m==null?0:Math.round((m/5)*100);
          const items = Q.filter(q=>q.categoryId===c.id);
          const comment = (S.comments[c.id]||"").trim();
          return `<section class="card">
            <h2 style="font-size:16px;font-family:inherit;font-weight:600">${c.name}</h2>
            <p class="fine">${c.theme}</p>
            <div class="row" style="margin:16px 0 0;font-size:14px;color:var(--muted)"><span>Category mean (1–5, excluding unable to observe)</span><b style="color:var(--fg)">${m==null?"n/a":m.toFixed(2)}</b></div>
            <div class="bar"><i style="width:${pct}%"></i></div>
            <ul class="items">${items.map(q=>{const v=S.answers[q.id]; const lab=v===0?"Unable to observe":v==null?"—":v; return `<li><span>${q.text}</span><b>${lab}</b></li>`;}).join("")}</ul>
            <div class="comment"><p class="cat">Comments</p><p ${comment?"":'style="color:var(--subtle);font-style:italic"'}>${comment?esc(comment):"No comment provided."}</p></div>
          </section>`;
        }).join("")}
        <p class="fine" style="margin-top:32px">In the live instrument, this page can be reserved for a facilitator report. This preview shows scores so you can walk the four categories with the client.</p>
        <button class="btn btn-primary" id="reset">Run preview again</button>`);
      drawRadar(scores);
      on("#reset", () => { location.reload(); });
    }
    function back() {
      if (S.i===0) { S.phase="profile"; render(); return; }
      S.i--; render();
    }
    function esc(s){ return String(s||"").replace(/[&<>"']/g, m => ({"&":"&"+"amp;","<":"&"+"lt;",">":"&"+"gt;","\"":"&"+"quot;","'":"&#39;"}[m])); }
    function drawRadar(scores) {
      const svg = document.getElementById("radar");
      const cx=200, cy=200, R=110, n=4;
      const pt = (i, r) => {
        const a = -Math.PI/2 + i*(Math.PI*2/n);
        return [cx + Math.cos(a)*r, cy + Math.sin(a)*r];
      };
      let g = "";
      for (let ring=1; ring<=5; ring++) {
        const pts = Array.from({length:n}, (_,i)=>pt(i, R*ring/5).join(",")).join(" ");
        g += `<polygon points="${pts}" fill="none" stroke="rgba(243,239,230,.28)" />`;
      }
      for (let i=0;i<n;i++) {
        const [x,y]=pt(i,R);
        g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(243,239,230,.28)" />`;
      }
      const poly = scores.map((s,i)=>pt(i, R*((s.mean||0)/5)).join(",")).join(" ");
      g += `<polygon points="${poly}" fill="rgba(243,239,230,.2)" stroke="#f3efe6" stroke-width="2" />`;
      scores.forEach((s,i) => {
        const [x,y]=pt(i, R*((s.mean||0)/5));
        g += `<circle cx="${x}" cy="${y}" r="3.5" fill="#f3efe6" stroke="#0f1f30" />`;
        const [lx,ly]=pt(i, R+28);
        const anchor = lx>cx+8?"start":lx<cx-8?"end":"middle";
        const lines = s.radar;
        lines.forEach((line, li) => {
          const dy = (ly<cy?- (lines.length-1)*7 : ly>cy? li*14 : (li-(lines.length-1)/2)*14);
          g += `<text x="${lx}" y="${ly+dy}" text-anchor="${anchor}" fill="#9aa8b6" font-size="12" font-family="Source Sans 3, sans-serif">${line}</text>`;
        });
      });
      svg.innerHTML = g;
    }
    render();
  </script>
</body>
</html>
