<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OR Assessment · Bellomo Leadership</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0f1f30; --surface:#16283a; --elevated:#1c3146; --fg:#f3efe6; --muted:#9aa8b6; --subtle:#6e7c8a; --border:rgba(243,239,230,.14); }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Source Sans 3", system-ui, sans-serif; }
    main { max-width: 980px; margin: 0 auto; padding: 40px 20px 64px; }
    h1, h2 { font-family: Fraunces, Georgia, serif; font-weight: 560; letter-spacing: -0.02em; }
    h1 { font-size: 40px; margin: 8px 0 0; }
    h2 { font-size: 28px; margin: 0; }
    p { line-height: 1.5; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .kicker { letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-size: 13px; font-weight: 600; }
    .muted { color: var(--muted); }
    .subtle { color: var(--subtle); }
    .grid { display: grid; gap: 28px; }
    @media (min-width: 860px) { .grid.two { grid-template-columns: 1fr 1fr; } }
    label { display: block; color: var(--muted); font-size: 14px; margin-top: 12px; }
    input, select, textarea { width: 100%; margin-top: 6px; border: 1px solid var(--border); background: var(--elevated); border-radius: 10px; padding: 12px 14px; outline: none; }
    textarea { min-height: 140px; }
    .btn { min-height: 44px; border: 0; border-radius: 10px; background: var(--fg); color: var(--bg); font-weight: 650; padding: 0 16px; }
    .ghost { background: transparent; color: var(--fg); border: 1px solid var(--border); }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .card, .pick { border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 14px 16px; text-align: left; width: 100%; }
    .pick.on, .scale.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .scale { display: flex; gap: 10px; width: 100%; min-height: 48px; align-items: center; border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 12px; padding: 10px 14px; margin-top: 8px; }
    .bar { height: 8px; background: var(--elevated); border-radius: 99px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--fg); }
    .link { word-break: break-all; color: var(--subtle); font-size: 14px; }
    .legal { margin-top: 36px; max-width: 560px; color: var(--subtle); font-size: 12px; }
    .err { color: var(--fg); }
  </style>
</head>
<body>
  <main id="app">Opening…</main>
  <script>
    const app = document.getElementById("app");
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => {
        if (c === "&") return "&" + "amp;";
        if (c === "<") return "&" + "lt;";
        if (c === ">") return "&" + "gt;";
        if (c === '"') return "&" + "quot;";
        return "&" + "#39;";
      });
    }
    const params = new URLSearchParams(location.search);
    const legal = `<p class="legal">© 2026 Bellomo Leadership LLC. All rights reserved. This instrument is proprietary. Unauthorized copying, distribution, or reuse is prohibited.</p>`;
    async function api(op, body, extra) {
      const q = new URLSearchParams({ op, ...(extra || {}) });
      const res = await fetch("/api/desk?" + q, {
        method: body ? "POST" : "GET",
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Request failed");
      return data;
    }
    function copy(value) {
      const area = document.createElement("textarea");
      area.value = value;
      area.style.position = "fixed";
      area.style.left = "0";
      area.style.top = "0";
      document.body.appendChild(area);
      area.focus();
      area.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      area.remove();
      if (ok) return Promise.resolve();
      if (navigator.clipboard) return navigator.clipboard.writeText(value);
      return Promise.reject();
    }
    function shell(html) { app.innerHTML = html + legal; }

    async function rater() {
      const token = params.get("r");
      const info = await api("form", null, { token });
      if (!info.found) return shell(`<h1>This link is not valid.</h1><p class="muted">Ask for a new one if you were invited to rate.</p>`);
      const meta = await api("status");
      if (info.submitted) return shell(`<p class="kicker">OR</p><h1>Thank you.</h1><p class="muted">Your response is in. You do not need to do anything else.</p>`);
      const who = [info.subjectName, info.subjectRole, info.site].filter(Boolean).join(" · ");
      let step = -1;
      const answers = {};
      const comments = {};
      const steps = [];
      meta.categories.forEach((cat) => {
        meta.items.filter((item) => item.categoryId === cat.id).forEach((item) => steps.push({ kind: "q", item, cat }));
        steps.push({ kind: "c", cat });
      });
      function paint() {
        if (step < 0) {
          shell(`<p class="kicker">OR</p><h1>Influence and Collaboration Assessment</h1>
            <p class="muted">You are rating ${esc(who)}. Fifteen items. About six to eight minutes. Rate only what you have actually observed.</p>
            <p class="subtle">${esc(info.name)} · ${esc(info.vantage)}</p>
            <div class="row"><button class="btn" id="begin">Begin</button></div>`);
          document.getElementById("begin").onclick = () => { step = 0; paint(); };
          return;
        }
        const current = steps[step];
        const pct = Math.round(((step + 1) / steps.length) * 100);
        if (current.kind === "q") {
          const n = meta.items.findIndex((item) => item.id === current.item.id) + 1;
          const scales = [[1,"Rarely true"],[2,"Occasionally true"],[3,"Sometimes true"],[4,"Often true"],[5,"Consistently true"],[0,"Unable to observe"]];
          shell(`<div class="bar"><span style="width:${pct}%"></span></div>
            <div class="row" style="justify-content:space-between"><span class="subtle">Question ${n} of 15</span><button class="ghost" id="back">Back</button></div>
            <p class="kicker">${current.cat.name}</p>
            <h2>${current.item.text}</h2>
            <p class="subtle" style="font-style:italic">${current.cat.theme}</p>
            <div id="scales"></div>
            <div class="row"><button class="btn" id="next" disabled>Next</button></div>`);
          const box = document.getElementById("scales");
          scales.forEach(([score, label]) => {
            const b = document.createElement("button");
            b.className = "scale" + (answers[current.item.id] === score ? " on" : "");
            b.innerHTML = `<b style="width:24px">${score === 0 ? "–" : score}</b> ${label}`;
            b.onclick = () => { answers[current.item.id] = score; paint(); };
            box.appendChild(b);
          });
          document.getElementById("next").disabled = answers[current.item.id] == null;
          document.getElementById("next").onclick = () => { step += 1; paint(); };
        } else {
          const last = step + 1 >= steps.length;
          shell(`<div class="bar"><span style="width:${pct}%"></span></div>
            <div class="row" style="justify-content:space-between"><span class="subtle">Optional comment</span><button class="ghost" id="back">Back</button></div>
            <p class="kicker">${current.cat.name}</p>
            <h2>Anything to add about ${current.cat.short}?</h2>
            <p class="muted">Specific examples help. Skip this if you have nothing to add.</p>
            <textarea id="note">${comments[current.cat.id] || ""}</textarea>
            <p class="err" id="err"></p>
            <div class="row"><button class="btn" id="next">${last ? "Submit" : "Continue"}</button></div>`);
          document.getElementById("next").onclick = async () => {
            comments[current.cat.id] = document.getElementById("note").value;
            if (!last) { step += 1; paint(); return; }
            document.getElementById("next").disabled = true;
            try {
              await api("submit", { token, answers, comments });
              shell(`<p class="kicker">OR</p><h1>Thank you.</h1><p class="muted">Your response is in. You do not need to do anything else.</p>`);
            } catch (err) {
              document.getElementById("err").textContent = err.message;
              document.getElementById("next").disabled = false;
            }
          };
        }
        const back = document.getElementById("back");
        if (back) back.onclick = () => { step -= 1; paint(); };
      }
      paint();
    }

    function mean(catId, ratings, items) {
      const keys = new Set(items.filter((item) => item.categoryId === catId).map((item) => item.id));
      const values = ratings.filter((row) => keys.has(row.itemKey) && row.value > 0).map((row) => row.value);
      if (!values.length) return null;
      return values.reduce((a, b) => a + b, 0) / values.length;
    }

    async function report() {
      const data = await api("report", null, { token: params.get("report") });
      const meta = await api("status");
      if (!data.found) return shell(`<h1>This report link is not valid.</h1>`);
      const who = [data.subjectName, data.subjectRole, data.site].filter(Boolean).join(" · ");
      const blocks = meta.categories.map((cat) => {
        const score = mean(cat.id, data.ratings, meta.items);
        const notes = data.comments.filter((row) => row.categoryId === cat.id);
        const items = meta.items.filter((item) => item.categoryId === cat.id).map((item) => {
          const values = data.ratings.filter((row) => row.itemKey === item.id && row.value > 0);
          const itemMean = values.length ? values.reduce((a, row) => a + row.value, 0) / values.length : null;
          return `<li style="display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--border);padding:10px 0" class="muted"><span>${item.text}</span><b style="color:var(--fg)">${itemMean == null ? "n/a" : itemMean.toFixed(2)}</b></li>`;
        }).join("");
        return `<section class="card" style="margin-top:12px"><h2 style="font-size:20px">${cat.name}</h2>
          <p class="subtle" style="font-style:italic">${cat.theme}</p>
          <p class="muted">Mean ${score == null ? "n/a" : score.toFixed(2)}</p>
          <div class="bar"><span style="width:${score == null ? 0 : Math.round((score / 5) * 100)}%"></span></div>
          <ul style="list-style:none;padding:0">${items}</ul>
          <div class="card" style="background:var(--elevated)"><p class="kicker">Comments</p>
          ${notes.length ? notes.map((n) => `<p>${esc(n.body)}</p>`).join("") : `<p class="subtle" style="font-style:italic">No comment provided.</p>`}
          </div></section>`;
      }).join("");
      const snapshot = meta.categories.map((cat) => {
        const score = mean(cat.id, data.ratings, meta.items);
        return `<div class="card"><div class="kicker">${cat.short}</div><div style="font-family:Fraunces,Georgia,serif;font-size:28px">${score == null ? "n/a" : score.toFixed(2)}</div></div>`;
      }).join("");
      shell(`<p class="kicker">Facilitator report</p><h1>${esc(data.subjectName)}</h1>
        <p class="muted">${esc(who)}</p>
        <p class="subtle">${data.done} of ${data.invited} raters finished. Comments are not attributed.</p>
        ${data.done < 3 ? `<p class="muted">Fewer than three finished responses. Treat the picture as a conversation, not a score.</p>` : ""}
        <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:16px">${snapshot}</div>
        ${data.vantages.length ? `<p class="muted">Finished from: ${data.vantages.map((row) => `${row.vantage} (${row.n})`).join(", ")}</p>` : ""}
        ${blocks}`);
    }

    async function desk() {
      const status = await api("status");
      if (!status.authed) {
        shell(`<p class="kicker">Bellomo Leadership</p><h1>OR desk</h1>
          <p class="muted">${status.needsSetup ? "Choose a password for this desk. You will need it next time." : "Open an engagement, add the raters, and send each one a private link."}</p>
          <form id="login" style="max-width:360px">
            <label>${status.needsSetup ? "Choose a desk password" : "Desk password"}
              <input id="pw" type="password" autocomplete="${status.needsSetup ? "new-password" : "current-password"}" />
            </label>
            ${status.needsSetup ? `<p class="subtle">At least 8 characters.</p>` : ""}
            <p class="err" id="err"></p>
            <div class="row"><button class="btn" type="submit">${status.needsSetup ? "Set password" : "Open desk"}</button></div>
          </form>`);
        document.getElementById("login").onsubmit = async (event) => {
          event.preventDefault();
          try {
            await api(status.needsSetup ? "setup" : "login", { password: document.getElementById("pw").value });
            desk();
          } catch (err) { document.getElementById("err").textContent = err.message; }
        };
        return;
      }
      const pack = await api("engagements");
      let selected = pack.engagements[0]?.id || "";
      function paint(notice) {
        const current = pack.engagements.find((row) => row.id === selected);
        shell(`<div style="display:flex;justify-content:space-between;gap:12px"><div><p class="kicker">Bellomo Leadership</p><h1>OR desk</h1></div><button class="ghost" id="lock">Lock</button></div>
          ${status.mailReady ? "" : `<p class="subtle">Mail is not on yet. Copy each private link.</p>`}
          <p class="muted" id="notice">${notice || ""}</p>
          <div class="grid two">
            <section>
              <h2>New engagement</h2>
              <form id="create">
                <label>Person or role being rated<input id="subject" /></label>
                <label>Role<input id="role" value="Site OR" /></label>
                <label>Site<input id="site" /></label>
                <div class="row"><button class="btn" type="submit">Create</button></div>
              </form>
              <div id="list" style="margin-top:16px"></div>
            </section>
            <section id="side"></section>
          </div>`);
        document.getElementById("lock").onclick = async () => { await api("logout", {}); desk(); };
        const list = document.getElementById("list");
        pack.engagements.forEach((row) => {
          const b = document.createElement("button");
          b.className = "pick" + (row.id === selected ? " on" : "");
          b.innerHTML = `<b>${esc(row.subjectName)}</b><div class="${row.id === selected ? "" : "subtle"}">${row.doneCount} of ${row.raterCount} finished${row.site ? " · " + esc(row.site) : ""}</div>`;
          b.onclick = () => { selected = row.id; paint(); };
          list.appendChild(b);
        });
        document.getElementById("create").onsubmit = async (event) => {
          event.preventDefault();
          try {
            const created = await api("create", {
              subjectName: document.getElementById("subject").value,
              subjectRole: document.getElementById("role").value,
              site: document.getElementById("site").value,
            });
            const next = await api("engagements");
            pack.engagements = next.engagements;
            selected = created.id;
            paint();
          } catch (err) { document.getElementById("notice").textContent = err.message; }
        };
        const side = document.getElementById("side");
        if (!current) { side.innerHTML = `<p class="muted">Create an engagement to add raters.</p>`; return; }
        side.innerHTML = `<h2>${esc(current.subjectName)}</h2><p class="muted">${esc([current.subjectRole, current.site].filter(Boolean).join(" · "))}</p>
          <div class="row"><button class="ghost" id="copy-report">Copy report link</button></div>
          <p class="link">${esc(current.reportLink)}</p>
          <h3 class="kicker">Add a rater</h3>
          <form id="add">
            <label>Name<input id="rname" /></label>
            <label>Email<input id="remail" type="email" /></label>
            <label>Vantage point<select id="vant">${status.vantages.map((v) => `<option>${v}</option>`).join("")}</select></label>
            <div class="row"><button class="btn">Add rater</button></div>
          </form>
          <div id="raters"></div>`;
        document.getElementById("copy-report").onclick = () => copy(current.reportLink).then(() => { document.getElementById("notice").textContent = "Copied."; }).catch(() => { document.getElementById("notice").textContent = "Select the link and copy it."; });
        document.getElementById("add").onsubmit = async (event) => {
          event.preventDefault();
          try {
            await api("rater", { engagementId: current.id, name: document.getElementById("rname").value, email: document.getElementById("remail").value, vantage: document.getElementById("vant").value });
            const next = await api("engagements");
            pack.engagements = next.engagements;
            paint("Rater added.");
          } catch (err) { document.getElementById("notice").textContent = err.message; }
        };
        const box = document.getElementById("raters");
        current.raters.forEach((rater) => {
          const el = document.createElement("div");
          el.className = "card";
          el.style.marginTop = "12px";
          el.innerHTML = `<b>${esc(rater.name)}</b><div class="muted">${esc(rater.email)} · ${esc(rater.vantage)}</div>
            <div class="subtle">${rater.submittedAt ? "Finished" : rater.sentAt ? "Invite sent" : "Not sent"}</div>
            <p class="link">${esc(rater.link)}</p>
            <div class="row"><button class="btn send">Send invite</button><button class="ghost copy">Copy link</button></div>`;
          el.querySelector(".copy").onclick = () => copy(rater.link).then(() => { document.getElementById("notice").textContent = "Copied."; });
          el.querySelector(".send").onclick = async () => {
            const result = await api("send", { raterId: rater.id });
            const next = await api("engagements");
            pack.engagements = next.engagements;
            paint(result.sent ? "Invite sent." : (result.reason || "Link is ready."));
          };
          box.appendChild(el);
        });
      }
      paint();
    }

    (params.get("r") ? rater() : params.get("report") ? report() : desk()).catch((err) => {
      shell(`<h1>The desk could not open.</h1><p class="muted">${err.message}</p>`);
    });
  </script>
</body>
</html>
